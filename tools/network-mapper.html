<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner - Tech & Electrical</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); min-height: 100vh; padding: 20px; color: #e2e8f0; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; }
        
        .controls { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .controls input { flex: 1; min-width: 200px; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        .controls button { padding: 12px 24px; border-radius: 6px; border: none; cursor: pointer; font-size: 16px; font-weight: bold; transition: transform 0.2s; }
        .controls button:hover { transform: scale(1.02); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        
        .status { padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .status.loading { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .status.success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status.error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status.info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        
        .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #1e293b; border-radius: 10px; padding: 20px; }
        .panel h2 { color: #38bdf8; margin-bottom: 15px; font-size: 18px; }
        
        .instructions { background: #0f172a; padding: 25px; border-radius: 8px; border: 2px solid #3b82f6; }
        .instructions h2 { color: #3b82f6; margin-bottom: 15px; }
        .instructions pre { background: #1e293b; padding: 15px; border-radius: 4px; color: #22c55e; overflow-x: auto; margin: 10px 0; }
        .instructions code { color: #22c55e; }
        
        .hosts-list { max-height: 500px; overflow-y: auto; }
        .host-item { background: #0f172a; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 3px solid #3b82f6; }
        .host-item.router { border-left-color: #f472b6; }
        .host-item.server { border-left-color: #ef4444; }
        .host-item.workstation { border-left-color: #22c55e; }
        .host-item.camera { border-left-color: #f59e0b; }
        .host-item.printer { border-left-color: #8b5cf6; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        
        @media (max-width: 768px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 Network Scanner - Tech & Electrical Services</h1>
        
        <div class="controls">
            <input type="text" id="subnetInput" placeholder="Enter subnet (e.g., 192.168.4.0/24)" value="192.168.4.0/24">
            <button class="btn-primary" onclick="showInstructions()">📋 Show Scan Commands</button>
            <button class="btn-secondary" onclick="testScan()">🧪 Test Scan Output</button>
        </div>
        
        <div id="status" class="status info">Ready. Enter a subnet and click a button.</div>
        
        <div class="content">
            <div class="panel">
                <h2>📋 Scan Instructions</h2>
                <div id="instructions" class="instructions">
                    <p>Click "Show Scan Commands" to see how to run a real network scan.</p>
                </div>
            </div>
            
            <div class="panel">
                <h2>📱 Hosts</h2>
                <div id="hostsList" class="hosts-list">
                    <div class="empty-state">No hosts scanned yet.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + type;
        }
        
        function showInstructions() {
            const subnet = document.getElementById('subnetInput').value.trim() || '192.168.4.0/24';
            const instructions = document.getElementById('instructions');
            
            instructions.innerHTML = `
                <h2>🔍 Real Network Scan</h2>
                <p>This tool requires the Python scanner to be run from terminal.</p>
                
                <h3 style="color: #22c55e; margin-top: 15px;">Command to run:</h3>
                <pre>cd /root/.openclaw/workspace/tools
python3 network-scanner.py --subnet ${subnet}</pre>
                
                <h3 style="color: #f59e0b; margin-top: 15px;">Quick test (no root):</h3>
                <pre>cd /root/.openclaw/workspace/tools
bash test-network-mapper.sh</pre>
                
                <h3 style="color: #60a5fa; margin-top: 15px;">Output:</h3>
                <p>The scanner will find all devices and display IP, MAC, vendor, and open ports.</p>
            `;
            
            showStatus('Scan instructions shown above.', 'info');
        }
        
        function testScan() {
            const subnet = document.getElementById('subnetInput').value.trim() || '192.168.4.0/24';
            showStatus('Testing scanner...', 'loading');
            
            // Run actual Python scanner
            const cmd = `cd /root/.openclaw/workspace/tools && python3 network-scanner.py --subnet ${subnet} --json 2>&1`;
            
            // Use fetch to call a backend - but since we don't have one, show command
            document.getElementById('instructions').innerHTML = `
                <h2>🧪 Test Output</h2>
                <p>To get real scan results, run this in terminal:</p>
                <pre>${cmd}</pre>
                <p style="margin-top: 15px; color: #64748b;">Or open a terminal and paste the command above.</p>
            `;
            
            // Show example of what real output looks like
            const baseIP = subnet.replace(/\.\d+\/\d+$/, '');
            const exampleHosts = [
                { ip: baseIP + '.1', type: 'router', vendor: 'Netgear' },
                { ip: baseIP + '.10', type: 'server', vendor: 'Dell' },
                { ip: baseIP + '.20', type: 'workstation', vendor: 'HP' },
                { ip: baseIP + '.21', type: 'workstation', vendor: 'Lenovo' },
                { ip: baseIP + '.30', type: 'camera', vendor: 'Hikvision' }
            ];
            
            let html = '<div class="hosts-list">';
            exampleHosts.forEach(h => {
                html += `<div class="host-item ${h.type}">
                    <strong>${h.ip}</strong> - ${h.vendor} (${h.type})
                </div>`;
            });
            html += '</div>';
            
            document.getElementById('hostsList').innerHTML = html;
            showStatus('Example output shown. Run real scanner for actual data.', 'success');
        }
        
        // Show instructions on load
        showInstructions();
    </script>
</body>
</html>
