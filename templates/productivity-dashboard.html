<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Productivity Dashboard - Internal</title>
  <style>
    :root{
      --bg: #f7f8fb;
      --card:#ffffff;
      --text:#1f2a37;
      --muted:#5f6b79;
      --primary:#1e88e5;
    }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial, Helvetica, sans-serif;}
    .container{max-width:1100px;margin:28px auto;padding:0 20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    h1{font-size:22px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .card{background:var(--card);border:1px solid #e5e7eb;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card h2{font-size:14px;letter-spacing:.4px;text-transform:uppercase;margin:0 0 8px 0;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:baseline}
    .value{font-size:28px;font-weight:700}
    .sub{color:var(--muted);font-size:12px}
    .chart{height:180px;background:#f3f4f6;border-radius:6px;position:relative}
    /* simple placeholder bars */
    .bar{position:absolute;bottom:0;width:20px;background:var(--primary);border-radius:4px}
    .bar.a{left:40px;height:90px;}
    .bar.b{left:80px;height:140px;}
    .bar.c{left:120px;height:60px;}
    .bar.d{left:160px;height:110px;}
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
    }
    /* Print friendly */
    @media print{
      .grid{grid-template-columns:1fr 1fr}
      .card{page-break-inside: avoid;}
      body{background:#fff;color:#000}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tech Productivity Dashboard (Internal - Print-friendly)</h1>
      <div class="sub">Placeholder data</div>
    </div>

    <div class="grid" aria-label="tech-dashboard-grid">
      <section class="card" aria-label="tickets-closed-per-tech">
        <h2>Tickets closed per tech</h2>
        <div class="chart" aria-label="bar-chart-placeholder" role="img">
          <div class="bar a" style="height:90px"></div>
          <div class="bar b" style="height:140px"></div>
          <div class="bar c" style="height:60px"></div>
          <div class="bar d" style="height:110px"></div>
        </div>
      </section>
      <section class="card" aria-label="average-handling-time">
        <h2>Average handling time</h2>
        <div class="row" style="align-items:baseline;margin-top:6px">
          <div class="value">12m 34s</div>
          <div class="sub">across all tickets</div>
        </div>
      </section>
      <section class="card" aria-label="utilization-percentage">
        <h2>Utilization %</h2>
        <div class="row" style="margin-top:6px">
          <div class="value" style="color:#1f8ef1">76%</div>
          <div class="sub">average across active techs</div>
        </div>
      </section>
      <section class="card" aria-label="reopen-rate">
        <h2>Reopen rate (quality)</h2>
        <div class="row" style="margin-top:6px">
          <div class="value">4.2%</div>
          <div class="sub">of tickets reopened</div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
