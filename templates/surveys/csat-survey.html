<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSAT / NPS Survey</title>
  <style>
    body{font-family:Arial, sans-serif; background:#f7f7f7; color:#333; padding:20px}
    .card{max-width:700px; margin:0 auto; background:#fff; padding:20px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,.08)}
    h1{font-size:22px; margin-bottom:12px}
    label{display:block; margin-top:12px; font-weight:600}
    textarea, input[type="text"], input[type="email"]{width:100%; padding:8px; margin-top:6px; border:1px solid #ddd; border-radius:4px}
    .radio{ display:flex; gap:12px; align-items:center; margin-top:6px}
    .btn{ margin-top:16px; padding:10px 14px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer}
    .btn.secondary{ background:#6c757d }
  </style>
</head>
<body>
  <div class="card">
    <h1>Customer Feedback Survey</h1>
    <form action="#" method="post" aria-label="CSAT survey">
      <label for="rating">NPS Rating (0-10)</label>
      <input type="range" id="rating" name="rating" min="0" max="10" value="9" oninput="document.getElementById('ratingOut').value=this.value"> 
      <output id="ratingOut">9</output>

      <label for="what-well">What did we do well?</label>
      <textarea id="what-well" name="what_well" rows="3"></textarea>

      <label for="improve">What could improve?</label>
      <textarea id="improve" name="improve" rows="3"></textarea>

      <div class="radio">
        <label>Would you refer us?</label>
        <input type="radio" id="ref-yes" name="refer" value="Yes"><label for="ref-yes">Yes</label>
        <input type="radio" id="ref-no" name="refer" value="No"><label for="ref-no">No</label>
      </div>

      <label for="comments">Open comments</label>
      <textarea id="comments" name="comments" rows="4"></textarea>

      <button type="submit" class="btn">Submit</button>
      <button type="reset" class="btn secondary" style="margin-left:8px">Reset</button>
    </form>
  </div>
</body>
</html>
