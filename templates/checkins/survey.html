<!DOCTYPE html>
<html>
<head>
  <title>Client Check-In Survey</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { max-width: 600px; margin: auto; padding: 20px; }
    .section { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Quick Check-In Survey</h2>
    <form action="#" method="POST">
      <div class="section">
        <label>On a scale of 0-10, how likely are you to recommend us?</label>
        <input type="text" name="nps" placeholder="0-10"/>
      </div>
      <div class="section">
        <label>What did you like or dislike?</label>
        <textarea name="feedback" rows="4" placeholder="Open feedback"></textarea>
      </div>
      <div class="section">
        <label>Would you refer us to others?</label>
        <input type="text" name="referral" placeholder="Yes/No"/>
      </div>
      <div class="section">
        <label>Upcoming projects or needs</label>
        <textarea name="projects" rows="4" placeholder="Describe upcoming needs"></textarea>
      </div>
      <div class="section">
        <button type="submit">Submit Survey</button>
      </div>
    </form>
  </div>
</body>
</html>
