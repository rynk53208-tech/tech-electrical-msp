<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech & Electrical Kanban</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #16213e; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .login-box h1 { margin-bottom: 20px; color: #00d9ff; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 6px; background: #0f3460; color: #fff; }
    .login-box button { width: 100%; padding: 12px; background: #00d9ff; border: none; border-radius: 6px; color: #1a1a2e; font-weight: bold; cursor: pointer; }
    .login-box button:hover { background: #00b8d4; }
    .app { display: none; }
    .header { background: #16213e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
    .header h1 { color: #00d9ff; font-size: 20px; }
    .header .user { color: #888; font-size: 14px; }
    .boards-nav { background: #0f3460; padding: 10px 20px; display: flex; gap: 10px; overflow-x: auto; }
    .board-tab { padding: 8px 16px; background: transparent; border: none; color: #888; cursor: pointer; border-radius: 6px; white-space: nowrap; }
    .board-tab.active { background: #00d9ff; color: #1a1a2e; }
    .kanban { display: flex; gap: 20px; padding: 20px; overflow-x: auto; min-height: calc(100vh - 120px); }
    .column { background: #16213e; min-width: 300px; max-width: 300px; border-radius: 10px; display: flex; flex-direction: column; }
    .column-header { padding: 15px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
    .column-header h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .column-header .count { background: #0f3460; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .column-tasks { padding: 10px; flex: 1; overflow-y: auto; }
    .task { background: #0f3460; padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; transition: transform 0.15s; }
    .task:hover { transform: translateY(-2px); }
    .task-title { font-weight: 500; margin-bottom: 8px; }
    .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #888; }
    .task-priority { padding: 2px 6px; border-radius: 4px; font-size: 10px; text-transform: uppercase; }
    .priority-high { background: #ff4757; color: #fff; }
    .priority-medium { background: #ffa502; color: #1a1a2e; }
    .priority-low { background: #2ed573; color: #1a1a2e; }
    .task-assignee { display: flex; align-items: center; gap: 5px; }
    .task-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
    .task-tag { background: #1a1a2e; padding: 2px 8px; border-radius: 4px; font-size: 10px; color: #00d9ff; }
    .add-task { padding: 10px; border-top: 1px solid #0f3460; }
    .add-task button { width: 100%; padding: 10px; background: transparent; border: 2px dashed #0f3460; border-radius: 6px; color: #666; cursor: pointer; }
    .add-task button:hover { border-color: #00d9ff; color: #00d9ff; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: #16213e; padding: 25px; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 15px; color: #00d9ff; }
    .modal-content label { display: block; margin-bottom: 5px; color: #888; font-size: 12px; }
    .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin-bottom: 15px; border: none; border-radius: 6px; background: #0f3460; color: #fff; }
    .modal-content textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: #00d9ff; color: #1a1a2e; font-weight: bold; }
    .btn-secondary { background: #0f3460; color: #fff; }
    .comments { margin-top: 20px; border-top: 1px solid #0f3460; padding-top: 15px; }
    .comment { background: #0f3460; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .comment-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #888; }
    .no-tasks { text-align: center; color: #666; padding: 20px; }
    .app-layout { display: flex; min-height: calc(100vh - 120px); }
    .kanban-container { flex: 1; display: flex; gap: 20px; padding: 20px; overflow-x: auto; }
    .activity-panel { width: 300px; background: #16213e; border-radius: 10px; margin: 20px 20px 20px 0; display: flex; flex-direction: column; max-height: calc(100vh - 120px); }
    .activity-panel.collapsed { width: 60px; }
    .activity-panel.collapsed .activity-header h3 { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); }
    .activity-panel.collapsed .activity-list, .activity-panel.collapsed .activity-expand { display: none; }
    .activity-header { padding: 15px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
    .activity-header h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #00d9ff; }
    .activity-expand { cursor: pointer; color: #00d9ff; font-size: 12px; padding: 5px 10px; background: #0f3460; border-radius: 4px; margin: 10px; text-align: center; }
    .activity-expand:hover { background: #00d9ff; color: #1a1a2e; }
    .activity-list { padding: 10px; flex: 1; overflow-y: auto; max-height: 300px; }
    .activity-item { padding: 10px; margin-bottom: 10px; background: #0f3460; border-radius: 6px; font-size: 12px; }
    .activity-item .user { color: #00d9ff; font-weight: 500; }
    .activity-item .action { color: #ffa502; }
    .activity-item .time { color: #666; font-size: 10px; margin-top: 5px; }
    .activity-item .task-title { color: #fff; margin-top: 5px; }
    .activity-item .details { color: #aaa; margin-top: 3px; font-style: italic; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>⚡ Tech & Electrical</h1>
      <p style="margin-bottom: 15px; color: #666;">Enterprise Kanban</p>
      <button onclick="autoLogin()">Enter</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app">
    <div class="header">
      <h1>⚡ Tech & Electrical Kanban</h1>
      <div>
        <span class="user" id="currentUser"></span>
        <button onclick="logout()" style="margin-left: 15px; padding: 5px 10px; background: #ff4757; border: none; border-radius: 4px; color: white; cursor: pointer;">Logout</button>
      </div>
    </div>
    <div class="boards-nav" id="boardsNav"></div>
    <div class="app-layout">
      <div class="kanban-container" id="kanban"></div>
      <div class="activity-panel" id="activityPanel">
        <div class="activity-header">
          <h3>📋 Activity</h3>
        </div>
        <div class="activity-list" id="activityList">
          <div style="text-align: center; color: #666; padding: 20px;">Loading...</div>
        </div>
        <div class="activity-expand" id="activityExpand" onclick="toggleActivity()">Show More ▼</div>
      </div>
    </div>
  </div>

  <!-- Task Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h2 id="modalTitle">New Task</h2>
      <label>Title</label>
      <input type="text" id="taskTitle">
      <label>Description</label>
      <textarea id="taskDesc"></textarea>
      <label>Priority</label>
      <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <label>Assignee</label>
      <select id="taskAssignee">
        <option value="">Unassigned</option>
      </select>
      <label>Tags (comma separated)</label>
      <input type="text" id="taskTags" placeholder="e.g., msp, urgent, barney">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveTask()">Save</button>
      </div>
      <div class="comments" id="commentsSection" style="display:none;">
        <h3>Comments</h3>
        <div id="commentsList"></div>
        <input type="text" id="newComment" placeholder="Add a comment..." style="margin-top: 10px;">
        <button onclick="addComment()" style="margin-top: 5px; padding: 8px 16px; background: #00d9ff; border: none; border-radius: 4px; cursor: pointer;">Add</button>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('kanban_token');
    let currentBoard = null;
    let currentUser = null;
    let editingTaskId = null;
    let currentColumnId = null;

    const API = 'http://localhost:3000/api';

    async function request(path, options = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(API + path, { ...options, headers });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    async function autoLogin() {
      token = 'demo';
      localStorage.setItem('kanban_token', token);
      currentUser = { username: 'Axiom', role: 'admin' };
      showApp();
    }

    function logout() {
      token = null;
      localStorage.removeItem('kanban_token');
      location.reload();
    }

    async function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('currentUser').textContent = currentUser.username + ' (' + currentUser.role + ')';
      await loadBoards();
      await loadUsers();
    }

    async function loadBoards() {
      const boards = await request('/boards');
      const nav = document.getElementById('boardsNav');
      nav.innerHTML = boards.map(b => `<button class="board-tab ${b.id === currentBoard?.id ? 'active' : ''}" onclick="selectBoard(${b.id})">${b.name}</button>`).join('');
      if (boards.length && !currentBoard) selectBoard(boards[0].id);
    }

    async function selectBoard(id) {
      currentBoard = await request('/boards/' + id);
      loadBoards();
      loadKanban();
    }

    async function loadUsers() {
      const users = await request('/users');
      const select = document.getElementById('taskAssignee');
      select.innerHTML = '<option value="">Unassigned</option>' + users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
    }

    async function loadKanban() {
      // Backend returns board with columns and tasks embedded
      const boardData = await request('/boards/' + currentBoard.id);
      const columns = boardData.columns || [];
      const kanban = document.getElementById('kanban');
      kanban.innerHTML = '';
      for (const col of columns) {
        const tasks = col.tasks || [];
        let html = `<div class="column">
          <div class="column-header">
            <h3>${col.name}</h3>
            <span class="count">${tasks.length}</span>
          </div>
          <div class="column-tasks">`;
        if (tasks.length === 0) html += '<div class="no-tasks">No tasks</div>';
        for (const task of tasks) {
          html += `<div class="task" onclick="openTask(${task.id})">
            <div class="task-title">${task.title}</div>
            <div class="task-meta">
              <span class="task-priority priority-${task.priority}">${task.priority}</span>
              <span>${task.assignee || 'Unassigned'}</span>
            </div>
            <div class="task-tags">${(task.tags || '').split(',').filter(t => t).map(t => `<span class="task-tag">${t.trim()}</span>`).join('')}</div>
          </div>`;
        }
        html += `</div><div class="add-task"><button onclick="openNewTask(${col.id})">+ Add Task</button></div></div>`;
        kanban.innerHTML += html;
      }
      loadActivity();
    }

    let activityExpanded = false;
    let allActivity = [];

    async function loadActivity() {
      try {
        allActivity = await request('/activity?limit=30');
        renderActivity();
      } catch (e) {
        document.getElementById('activityList').innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">Unable to load activity</div>';
      }
    }

    function renderActivity() {
      const list = document.getElementById('activityList');
      const expandBtn = document.getElementById('activityExpand');
      const displayCount = activityExpanded ? allActivity.length : 5;
      const displayItems = allActivity.slice(0, displayCount);
      
      if (!allActivity.length) {
        list.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No activity yet</div>';
        expandBtn.style.display = 'none';
        return;
      }
      
      list.innerHTML = displayItems.map(a => `
        <div class="activity-item">
          <span class="user">${a.username || 'System'}</span>
          <span class="action">${a.action.replace('_', ' ')}</span>
          ${a.task_title ? `<div class="task-title">📝 ${a.task_title}</div>` : ''}
          ${a.details ? `<div class="details">${a.details}</div>` : ''}
          <div class="time">${new Date(a.created_at).toLocaleString()}</div>
        </div>
      `).join('');
      
      expandBtn.style.display = allActivity.length > 5 ? 'block' : 'none';
      expandBtn.textContent = activityExpanded ? 'Show Less ▲' : `Show More (${allActivity.length - 5}) ▼`;
    }

    function toggleActivity() {
      activityExpanded = !activityExpanded;
      renderActivity();
    }

    function openNewTask(columnId) {
      editingTaskId = null;
      currentColumnId = columnId;
      document.getElementById('modalTitle').textContent = 'New Task';
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value = '';
      document.getElementById('taskPriority').value = 'medium';
      document.getElementById('taskTags').value = '';
      document.getElementById('commentsSection').style.display = 'none';
      document.getElementById('taskModal').classList.add('active');
    }

    async function openTask(id) {
      const task = await request('/tasks/' + id);
      editingTaskId = id;
      currentColumnId = task.column_id;
      document.getElementById('modalTitle').textContent = 'Edit Task';
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('taskDesc').value = task.description || '';
      document.getElementById('taskPriority').value = task.priority;
      document.getElementById('taskAssignee').value = task.assignee || '';
      document.getElementById('taskTags').value = task.tags || '';
      document.getElementById('commentsSection').style.display = 'block';
      loadComments(id);
      document.getElementById('taskModal').classList.add('active');
    }

    async function loadComments(taskId) {
      const comments = await request('/tasks/' + taskId + '/comments');
      document.getElementById('commentsList').innerHTML = comments.map(c => `<div class="comment"><div class="comment-header"><span>${c.username}</span><span>${new Date(c.created_at).toLocaleString()}</span></div>${c.content}</div>`).join('');
    }

    async function addComment() {
      const content = document.getElementById('newComment').value;
      if (!content) return;
      await request('/tasks/' + editingTaskId + '/comments', { method: 'POST', body: JSON.stringify({ content }) });
      document.getElementById('newComment').value = '';
      loadComments(editingTaskId);
    }

    async function saveTask() {
      const data = {
        title: document.getElementById('taskTitle').value,
        description: document.getElementById('taskDesc').value,
        priority: document.getElementById('taskPriority').value,
        assignee: document.getElementById('taskAssignee').value,
        tags: document.getElementById('taskTags').value
      };
      if (editingTaskId) {
        await request('/tasks/' + editingTaskId, { method: 'PUT', body: JSON.stringify(data) });
      } else {
        await request('/tasks', { method: 'POST', body: JSON.stringify({ column_id: currentColumnId, ...data }) });
      }
      closeModal();
      loadKanban();
    }

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    // Check auth on load
    if (token) {
      request('/auth/me').then(data => {
        if (data) { currentUser = data; showApp(); }
      });
    }
  </script>
</body>
</html>
